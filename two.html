<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>College Registration Form</title>
<style>
body {
font-family: Arial, sans-serif;
background: rgb(244, 246, 249);
margin: 0;
padding: 20px;
}
.form-container {
max-width: 500px;
margin: 0 auto;
background: white;
padding: 25px;
border-radius: 8px;
box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}
h2 {
text-align: center;
color: rgb(51, 51, 51);
}
.form-group {
margin-bottom: 15px;
}
label {
display: block;
margin-bottom: 5px;
color: rgb(85, 85, 85);
font-weight: bold;
}
input, select, textarea {
width: 100%;
padding: 10px;
border: 1px solid rgb(204, 204, 204);
border-radius: 4px;
box-sizing: border-box;
}
input:focus, select:focus, textarea:focus {
border-color: rgb(0, 123, 255);
outline: none;
}
button {
width: 100%;
padding: 12px;
background: rgb(0, 123, 255);
color: white;
border: none;
border-radius: 4px;
font-size: 16px;
cursor: pointer;
}
button:hover {
background: rgb(0, 86, 179);
}
</style>
</head>
<body>
<div class="form-container">
<h2>College Registration Form</h2>
<form action="javascript:void(0)" method="post">
<div class="form-group">
<label for="fullname">Full Name</label>
<input type="text" id="fullname" name="fullname" required pattern="[A-Za-z ]{3,50}" placeholder="Enter full name">
</div>
<div class="form-group">
<label for="email">Email Address</label>
<input type="email" id="email" name="email" required placeholder="Enter email address">
</div>
<div class="form-group">
<label for="phone">Phone Number</label>
<input type="tel" id="phone" name="phone" required pattern="[0-9]{10}" placeholder="10-digit mobile number">
</div>
<div class="form-group">
<label for="dob">Date of Birth</label>
<input type="date" id="dob" name="dob" required>
</div>
<div class="form-group">
<label for="course">Course</label>
<select id="course" name="course" required>
<option value="">Select Course</option>
<option value="cs">Computer Science</option>
<option value="it">Information Technology</option>
<option value="ds">Data Science</option>
</select>
</div>
<div class="form-group">
<label for="address">Address</label>
<textarea id="address" name="address" rows="3" required placeholder="Enter address"></textarea>
</div>
<button type="submit">Register</button>
</form>
</div>
</body>
</html>
